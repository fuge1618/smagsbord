<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smagsbord</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9E1D4">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smagsbord">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--papel:#F5F0E8;--lino:#E9E1D3;--tinta:#1D1D1B;--suave:#605A54;--linea:#CFC4B3;--surf:#FBF8F2;--arena:#DCC9A8;--papaya:#FF8000;--onacc:#1D1D1B}
[data-ac="s"]{stroke:var(--papaya)}[data-ac="f"]{fill:var(--papaya)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:24px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--papaya);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;color:var(--suave);text-transform:uppercase}
.sm{font-size:13px;line-height:18px;color:var(--suave)}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--tinta);background:transparent;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--papaya);border-color:var(--papaya);color:var(--onacc)}
.btn.ghost{border-color:var(--linea)}
.chip{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--linea);background:transparent;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.icb{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--suave);flex:none}
.inp{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--linea);background:var(--surf);width:100%}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tk{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
/* layout */
#app{min-height:100%;display:flex}
.side{width:232px;flex:none;padding:28px 16px;border-right:1px solid var(--linea);display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:23px;font-weight:600;letter-spacing:-.01em;background:none;border:0;text-align:left}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;text-align:left}
.nav button.on{background:var(--lino);font-weight:600;box-shadow:inset 4px 0 0 var(--papaya)}
.nav button span:last-child{font-size:13px;color:var(--suave);font-weight:400}
.main{flex:1;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.search{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:1px solid var(--linea);border-radius:12px;background:var(--surf);color:var(--suave)}
.search input{flex:1;border:0;background:transparent;outline:none;min-height:44px;color:var(--tinta);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 24px}
.card{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:left}
.ph{aspect-ratio:4/3;border-radius:12px;background:var(--lino);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--lino);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero .hb{position:absolute;right:10px;bottom:10px;min-height:44px;font-size:14px;background:var(--papel);border-color:var(--linea);cursor:pointer}
.card b{font-size:17px;line-height:22px;font-weight:600;display:block}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.head h1{flex:1;min-width:200px;font-size:22px;line-height:28px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;background:none;border:0;color:var(--suave);font-size:15px;padding:0}
.two{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.info{width:320px;flex:1 1 280px;max-width:380px;display:flex;flex-direction:column;gap:20px}
.parts{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.part{background:var(--lino);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.part h2{font-size:18px;line-height:24px;font-weight:600;flex:1}
.ing{display:flex;gap:12px;font-size:15px;line-height:22px}
.ing b{width:78px;flex:none;font-weight:600}
.step{width:48px;height:48px;border-radius:12px;border:1px solid var(--tinta);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.x{font-size:18px;font-weight:600;background:var(--papaya);color:var(--onacc);padding:5px 12px;border-radius:12px}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nut b{display:block;font-size:20px;line-height:26px;font-weight:600}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.lrow>div{flex:1;min-width:0}
.lrow b{display:block;font-weight:600}
.slot{background:var(--papel);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.slot>div{flex:1;min-width:0}
.panel{background:var(--lino);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.empty{padding:32px;border:1px dashed var(--linea);border-radius:12px;color:var(--suave);text-align:center}
.toast{position:fixed;left:50%;top:18px;max-width:calc(100% - 32px);text-align:center;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20}
/* cocina */
.co{position:fixed;inset:0;background:var(--papel);z-index:10;display:flex;flex-direction:column;overflow:auto}
.co header{display:flex;align-items:center;gap:12px;padding:16px 24px 0;flex:none}
.segs{flex:none}
.co .tabs{display:flex;gap:8px;flex:none;overflow-x:auto}
.tab{min-height:56px;padding:0 20px;border-radius:12px;border:1px solid var(--linea);background:transparent;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;white-space:nowrap}
.tab.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.tab span{font-size:13px;font-weight:400;opacity:.8}
.segs{display:flex;gap:8px;padding:16px 24px 0}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--linea)}
.segs i.d{background:var(--tinta)}.segs i.n{background:var(--papaya)}
.cobody{flex:1 0 auto;display:flex;gap:28px;padding:20px 24px;flex-wrap:wrap}
.media{flex:1 1 300px;max-width:500px;min-height:240px;background:var(--lino);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.media div{flex:1;display:flex;align-items:center;justify-content:center}
.cotext{flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.cotext .t{font-size:clamp(24px,3.2vw,36px);line-height:1.28;font-weight:600;letter-spacing:-.01em}
.cotext .s{font-size:19px;line-height:28px;color:var(--suave)}
.cofoot{display:flex;gap:14px;padding:12px 24px 22px;position:sticky;bottom:0;background:var(--papel);border-top:1px solid var(--linea);flex:none}
.cofoot button{min-height:76px;border-radius:12px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--tinta);background:transparent;flex:1}
.cofoot .nx{flex:2;background:var(--papaya);border-color:var(--papaya);color:var(--onacc)}
.cofoot button:disabled{opacity:.35}
.q{font-weight:600;box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--papaya) 60%,transparent)}
.need{background:var(--lino);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.need .ing{font-size:21px;line-height:30px}.need .ing b{width:104px}
.ck{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;border-radius:12px;border:1px solid var(--linea);background:transparent;text-align:left;font-size:19px;line-height:26px;width:100%}
.ck i{width:28px;height:28px;border-radius:8px;border:2px solid var(--tinta);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal}
.ck.on{background:var(--lino);border-color:var(--lino)}
.ck.on i{background:var(--papaya);border-color:var(--papaya);color:var(--onacc)}
.ck.on span,.ck.on b{color:var(--suave)}
.stg{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.stg .chip{font-weight:600}
.dest{background:var(--lino);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 5px 0 0 var(--papaya)}
.dest b{font-size:26px;line-height:32px;font-weight:600}
.note{background:var(--lino);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 4px 0 0 var(--papaya);font-size:16px;line-height:23px}
.finw{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 20px}
.finb{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;text-align:left;margin:10px 0}
.cfg{display:flex;flex-direction:column;gap:16px;padding:22px 0;border-top:1px solid var(--linea)}
.cfg h2{font-size:18px;line-height:24px;font-weight:600}
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:12px;border:1px solid;text-align:left;min-height:104px}
.pc.on{box-shadow:inset 0 0 0 1px currentColor}
.pc b{font-size:17px;font-weight:600}
.pcs{display:flex;gap:6px}.pcs i{width:30px;height:30px;border-radius:8px;border:1px solid rgba(128,128,128,.35)}
.sw{width:56px;height:32px;border-radius:16px;border:1px solid var(--linea);background:var(--lino);padding:3px;display:flex;flex:none}
.sw i{width:24px;height:24px;border-radius:12px;background:var(--suave);transition:transform .15s}
.sw.on{background:var(--papaya);border-color:var(--papaya)}.sw.on i{background:var(--onacc);transform:translateX(24px)}
.tbox{background:var(--lino);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tnum{font-size:46px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.step.on{background:var(--tinta);color:var(--papel)}
.tadjs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tadj{min-height:48px;border-radius:12px;border:1px solid var(--linea);background:var(--papel);font-size:15px;font-weight:600;padding:0 4px}
.trow2{display:flex;gap:10px}.trow2 .btn{flex:1;min-height:58px;font-size:18px}.trow2 .btn:disabled{opacity:.4}
.tstrip{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px 0}
.tstrip .chip{display:flex;align-items:center;gap:8px;border-color:var(--papaya)}
/* splash */
#splash{position:fixed;inset:0;background:var(--papel);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .4s}
#splash .n{font-size:clamp(48px,9vw,96px);line-height:1;font-weight:600;letter-spacing:-.02em;opacity:0;animation:sp-up .5s ease-out 1.7s forwards}
#splash .g{font-size:20px;color:var(--suave);opacity:0;animation:sp-up .5s ease-out 1.9s forwards}
#splash .by{position:absolute;bottom:40px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--suave);opacity:0;animation:sp-fade .5s ease-out 2.3s forwards}
.sp-p,.sp-h,.sp-w{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.sp-p{animation:sp-draw .75s cubic-bezier(.6,0,.2,1) .15s forwards}
.sp-h{animation:sp-draw .25s ease-out .8s forwards}
.sp-w{animation:sp-draw .5s cubic-bezier(.4,0,.2,1) forwards,sp-float 2.6s ease-in-out infinite}
.sp-w1{animation-delay:1s,1.6s}.sp-w2{animation-delay:1.15s,1.9s}.sp-w3{animation-delay:1.3s,2.2s}
@keyframes sp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sp-draw{0%{stroke-dashoffset:1;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.msw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;height:48px;border-radius:24px;border:1px solid var(--linea);background:var(--lino);padding:0;flex:none;margin-left:auto;font-size:15px;font-weight:600}
.msw span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:0 18px;color:var(--suave);transition:color .18s}
.msw i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:21px;background:var(--tinta);transition:transform .18s}
.msw.s i{transform:translateX(100%)}
.msw:not(.s) span:first-of-type,.msw.s span:last-of-type{color:var(--papel)}
.sbody{flex:1 0 auto;display:flex;gap:36px;padding:20px 24px 28px;flex-wrap:wrap;align-items:flex-start}
.scol1{flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:22px}
.scol2{flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px}
.scol1 section,.scol2 section{display:flex;flex-direction:column}
.scol2 section{gap:20px}
.si{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linea);padding:12px 4px;font-size:18px;line-height:26px;min-height:52px}
.si b{font-weight:600;min-width:88px;flex:none}
.si em{font-style:normal;color:var(--suave)}
.si.on,.si.on em{color:var(--suave);text-decoration:line-through}
.sst{display:flex;gap:16px;align-items:flex-start}
.sst>div{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.sx{width:48px;height:48px;border-radius:24px;border:2px solid var(--tinta);background:transparent;font-size:19px;font-weight:600;flex:none;display:flex;align-items:center;justify-content:center}
.sst.on .sx{background:var(--papaya);border-color:var(--papaya);color:var(--onacc)}
.sst p{font-size:21px;line-height:31px;cursor:pointer;padding-top:8px}
.sst.on p{color:var(--suave);text-decoration:line-through}
/* jerarquía: títulos fuertes y recuadros */
.head h1{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.head h1::after{content:"";display:block;width:48px;height:4px;border-radius:2px;background:var(--papaya);margin-top:8px}
.h{font-size:17px;line-height:22px;font-weight:700;color:var(--tinta);display:flex;align-items:center;gap:10px;margin:0}
.h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--papaya);flex:none}
.box{background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.side{background:var(--lino)}
.nav button.on{background:var(--papel)}
.card{background:var(--surf);border:1px solid var(--linea);border-radius:12px;overflow:hidden;gap:0}
.card .ph{border-radius:0;border-bottom:1px solid var(--linea)}
.card>div:last-child{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.card b{font-size:18px;line-height:23px;font-weight:700}
.part{background:var(--surf);border:1px solid var(--linea);padding:0;gap:0;overflow:hidden}
.part>div{padding:14px 16px}
.part>div:first-child{background:var(--lino);border-bottom:1px solid var(--linea);padding:12px 8px 12px 16px}
.part h2{font-size:19px;font-weight:700}
.cfg{background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:20px 22px;border-top:1px solid var(--linea)}
.cfg h2{font-size:20px;line-height:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.cfg h2::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--papaya);flex:none}
.box .lrow:last-child,.cfg .lrow:last-child{border-bottom:0;padding-bottom:0}
.box .lrow:first-child{padding-top:0}
.box input[type=url],.box textarea{width:100%;font:inherit;font-size:15px;line-height:22px;padding:12px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--papel);color:var(--tinta)}
.side .add{margin:0 0 4px;justify-content:flex-start}
.gcol a.btn svg{width:18px;height:18px}
.panel{border:1px solid var(--linea)}
.co header{background:var(--lino);border-bottom:1px solid var(--linea);padding:14px 24px}
.co header .chip:not(.on),.msw{background:var(--papel)}
.cotext>.lbl{font-size:14px;line-height:18px;color:var(--tinta);font-weight:700;display:flex;align-items:center;gap:10px}
.cotext>.lbl::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--papaya);flex:none}
.need,.dest,.tbox{border:1px solid var(--linea)}
.scol1{background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:18px 18px 6px}
.scol1 .si:last-child{border-bottom:0}
.scol1 section{gap:4px}
.scol2 section{background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:20px}
.finb .box{background:var(--surf)}
/* imágenes del modo cocina */
.em{width:44px;height:44px;border-radius:12px;background:var(--lino);display:inline-flex;align-items:center;justify-content:center;font-size:26px;line-height:1;flex:none;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-style:normal}
.em.l{width:88px;height:88px;font-size:52px;border-radius:16px}
.rc{width:44px;height:44px;border-radius:12px;background:var(--lino);padding:7px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rc.l{width:88px;height:88px;padding:16px;border-radius:16px}
.ck.on .em,.ck.on .rc{background:var(--papel)}
.flow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:16px}
.tils{display:flex;gap:12px;flex-wrap:wrap}
.til{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;width:116px;font-size:15px;line-height:20px}
.til b{font-weight:700;font-size:17px;line-height:22px;margin-top:6px}
.til.dst{width:168px;border:2px solid var(--papaya);border-radius:14px;padding:12px 10px}
.til.dst b{font-size:20px;line-height:25px}
.fl-a svg{width:40px;height:40px;stroke:var(--papaya);stroke-width:2.6}
.need .tils{margin-top:6px}
.tks{display:flex;gap:10px;flex-wrap:wrap}
.tkt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--lino);border-radius:12px;padding:8px 6px 6px;width:104px;font-size:13px;line-height:17px;font-weight:600;text-align:center}
.sst.on .tks{opacity:.4}
.si{align-items:center}
.ck .em+b,.ck .rc+span{margin-left:0}
/* procesos gráficos */
.strip{--z:84px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.strip.g{--z:clamp(92px,min(21vw,26vh),216px);justify-content:center;gap:12px}
.fg{margin:0;width:var(--z);display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;font-size:12px;line-height:15px}
.fg b{font-weight:700}
.strip.g .fg{font-size:clamp(13px,1.5vw,17px);line-height:1.3;gap:8px}

function meta(i){if(i._m)return i._m;const n=i.n.toLowerCase(),su=SG[i.u]||i.u,t=TIP.find(x=>x[0].test(n));const isV=VOL[su]!=null,isM=MAS[su]!=null;

return`<main class="main"><div class="head"><button class="back" data-a="nav" data-v="${e.tipo==="r"?"todas":"platos"}">${IC.back}${e.tipo==="r"?"Recetas":"Mis platos"}</button><h1>${esc(e.nombre)}</h1>
${e.tipo==="r"?`<button class="btn" data-a="hice">${IC.check}La hice hoy</button>`:`<button class="btn ghost" data-a="delplato">Borrar plato</button>`}<button class="btn pri" data-a="cocina">Modo cocina</button></div>

<div class="box"><span class="h">Listas</span><div class="row">${DB.listas.map(l=>`<button class="chip ${inL(l)?"on":""}" data-a="tlist" data-v="${l.id}" aria-pressed="${inL(l)}">${esc(l.nombre)}</button>`).join("")}${ST.newlist?`<label class="sr" for="nl">Nombre de la lista nueva</label><input id="nl" class="inp" style="width:170px" placeholder="Nombre de la lista">`:`<button class="chip" data-a="newlist">${"+ Nueva lista"}</button>`}</div></div></div>

<div id="alist" class="box" style="gap:0">${ps.map(p=>{const on=A.partes.includes(p.id);return`<div class="lrow"><div><b>${esc(pnom(p))}</b><span class="sm">${CATN[p.cat]} · de «${esc(R(p.receta).nombre)}»</span></div>${on?`<span class="sm" style="display:flex;align-items:center;gap:6px;font-weight:600">${IC.check}En el plato</span>`:`<button class="step" style="width:44px;height:44px" data-a="aadd" data-v="${p.id}" aria-label="Agregar ${esc(pnom(p))} al plato">${IC.plus}</button>`}</div>`}).join("")||`<div class="empty">Nada coincide.</div>`}</div></div>
<aside class="panel" style="flex:1 1 320px;max-width:460px" aria-label="Mi plato"><span class="h">Mi plato</span><div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="an">Nombre del plato</label><input id="an" class="inp" style="font-size:18px;font-weight:600;background:var(--papel)" value="${esc(nm)}" placeholder="Se arma solo con las partes"><span class="sm">Se arma solo con las partes. Lo podés cambiar.</span></div>
<div style="display:flex;flex-direction:column;gap:8px">${A.partes.map(id=>{const p=PARTES[id];return`<div class="slot"><div><span class="lbl">${CATN[p.cat]}</span><b style="display:block;font-size:17px;line-height:22px;font-weight:600">${esc(pnom(p))}</b><span class="sm">de «${esc(R(p.receta).nombre)}»</span></div><button class="icb" data-a="adel" data-v="${id}" aria-label="Quitar ${esc(pnom(p))}">${IC.x}</button></div>`}).join("")||`<div class="empty" style="background:var(--papel)">Agregá partes desde la lista.</div>`}</div>
${A.partes.length?`<div><span class="lbl">Por porción, aproximado</span><div style="font-size:15px;line-height:22px">${n[0]} kcal · ${n[1]} g proteínas · ${n[2]} g carbos · ${n[3]} g grasas</div></div>`:""}
<button class="btn pri" data-a="asave" ${A.partes.length<2?"disabled style=\"opacity:.4\"":""}>Guardar plato</button>${A.partes.length<2?`<span class="sm">Elegí al menos dos partes.</span>`:""}</aside></div></main>`}
function listas(){if(ST.lid){const l=DB.listas.find(x=>x.id===ST.lid);if(l){const items=l.items.map(ent).filter(Boolean);return`<main class="main"><div class="head"><button class="back" data-a="nav" data-v="listas">${IC.back}Listas</button><h1>${esc(l.nombre)}</h1>${esFija(l.id)?`<span class="sm">Lista fija</span>`:`<button class="btn ghost" data-a="dellist">Borrar lista</button>`}</div>

<div class="box" style="max-width:520px"><span class="h">Crear una lista</span><div class="row" style="flex-wrap:nowrap"><label class="sr" for="nl2">Nombre de la lista nueva</label><input id="nl2" class="inp" placeholder="Nombre de una lista nueva"><button class="btn" data-a="addlist">Crear</button></div></div>
<p class="sm">Una misma receta puede estar en varias listas. Se guarda una sola vez.</p></main>`}

${DB.gkey?`<div class="lrow"><div><b>Clave guardada</b><span class="sm">Termina en ${esc(DB.gkey.slice(-4))}. Queda solo en este dispositivo.</span></div><button class="btn ghost" data-a="gkdel">Borrar la clave</button></div>`:`<label class="lbl" for="gkey">Clave de Gemini</label><div class="row" style="flex-wrap:nowrap"><input id="gkey" type="password" autocomplete="off" placeholder="Pegá acá la clave" style="flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--papel);color:var(--tinta)"><button class="btn pri" data-a="gksave">Guardar</button></div><span class="sm">Queda guardada solo en este dispositivo. Cualquiera que lo use puede cargar recetas con ella.</span>`}<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--linea);padding-top:14px"><span class="lbl">Servidor de la familia</span>${srvOn()?`<div class="lrow"><div><b>Conectado</b><span class="sm">${esc(DB.srv.replace(/^https?:\/\//,""))}. Las recetas de enlaces y textos se arman en el servidor, aunque cierres la app.</span></div><button class="btn ghost" data-a="srvdel">Desconectar</button></div>`:`<span class="sm">Opcional. Con el servidor, la app deja el pedido y la receta se arma sola aunque cierres la app o se apague la pantalla. No hace falta la clave de Gemini en este dispositivo.</span><label class="lbl" for="srvu">Dirección del servidor</label><input id="srvu" type="url" autocomplete="off" placeholder="https://…" style="font:inherit;padding:12px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--papel);color:var(--tinta)"><label class="lbl" for="srvc">Código de la familia</label><input id="srvc" type="password" autocomplete="off" style="font:inherit;padding:12px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--papel);color:var(--tinta)"><div class="row"><button class="btn pri" data-a="srvsave">Conectar</button></div>`}</div>
<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Modelo</span><div class="row">${[["rap","Rápido"],["pot","Potente"]].map(o=>`<button class="chip ${(DB.gniv||"rap")===o[0]?"on":""}" data-a="uni" data-v="gniv|${o[0]}" aria-pressed="${(DB.gniv||"rap")===o[0]}">${o[1]}</button>`).join("")}</div><span class="sm">Rápido alcanza para casi todas las recetas y es gratis. Potente prueba primero los modelos más capaces de Google, que pueden pedir una cuenta con cobro habilitado y cuestan más por receta. Si no están disponibles, la app sigue con los rápidos.</span></div></section>
<section class="cfg"><h2>Unidades</h2>${[["uliq","Líquidos",[["ml","Mililitros"],["g","Gramos"],["cuch","Tazas y cucharadas"],["orig","Como en la receta"]],"ml"],["usec","Secos que se miden: harina, azúcar, especias",[["g","Gramos"],["cuch","Tazas y cucharadas"],["orig","Como en la receta"]],"orig"]].map(u=>`<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">${u[1]}</span><div class="row">${u[2].map(o=>`<button class="chip ${(DB[u[0]]||u[3])===o[0]?"on":""}" data-a="uni" data-v="${u[0]}|${o[0]}" aria-pressed="${(DB[u[0]]||u[3])===o[0]}">${o[1]}</button>`).join("")}</div></div>`).join("")}<span class="sm">${(()=>{const a=I(2,"cda","aceite de oliva"),b=I(200,"g","harina");return`Ejemplo: 2 cdas de aceite se muestran como <b>${qtyTxt(a,1)}</b>, y 200 g de harina como <b>${qtyTxt(b,1)}</b>.`})()} Menos de 5 g se muestra siempre en cucharaditas, porque una balanza de cocina no lo mide. La carne, las verduras y lo que se cuenta por unidades quedan como están. Las conversiones son aproximadas: dependen del peso de cada ingrediente.</span></section>

// modo cocina
let timers={},tint=null,wl=null;
const fmtT=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const durT=m=>m>=60?(m%60?Math.floor(m/60)+" h "+m%60+" min":m/60+" h"):m+" min";
const tmin=key=>{const[pid,i]=key.split(":");return PARTES[pid].pasos[+i].timer};
const tget=key=>timers[key]||(timers[key]={rem:tmin(key)*60000,base:tmin(key)*60000,end:0,run:false,started:false,done:false});
const tleft=t=>t.run?Math.max(0,t.end-Date.now()):t.rem;
const ttxt=t=>t.done?"Listo":fmtT(tleft(t)/1000);

const PROMPT="Sos un asistente que convierte una receta al formato de la app de recetas Smagsbord. La receta puede llegar como video, como fotos de un libro o de una hoja escrita a mano, como página web o como texto. Si es un video, miralo completo, imagen y audio. Si son fotos, leé todo el texto, también lo manuscrito. Devolvé SOLO un objeto JSON válido, sin texto antes ni después.\n\nREGLAS GENERALES\n- Escribí en español rioplatense, con voseo (\"picá\", \"mezclá\"), en frases cortas y claras.\n- Usá solo lo que la fuente dice o muestra. No inventes ingredientes ni pasos. Si una cantidad no se dice, estimala por lo que se ve y anotalo en \"dudas\".\n- Pasá todo a sistema métrico (g, kg, ml, l, °C). Las cucharadas y tazas pueden quedar como \"cda\", \"cdita\" y \"taza\".\n- PARTES: separá en partes solo lo que se cocina en paralelo, en recipientes distintos, y después se junta en el plato. Churrasco con puré de papas: dos partes. Fideos con salsa: dos partes. Albóndigas con arroz: dos partes (el arroz, y las albóndigas con su salsa). Si todo se cocina junto en el mismo recipiente, es una sola parte: un risotto, o un pollo que se termina dentro de su salsa.\n- Un mismo ingrediente que se usa en dos partes figura en las dos, con la cantidad que le toca a cada una.\n- REGLA MÁS IMPORTANTE: ninguna cantidad, medida ni peso puede quedar escrito a mano en un texto. La app convierte las unidades y ajusta todo según las porciones, así que las cantidades solo existen en la lista \"ingredientes\" y en los textos se nombran con {n}. Está mal: \"agregá 2 cucharadas de queso\". Está bien: \"agregá {14}\".\n\nFORMATO\n{\n  \"nombre\": \"título corto del plato, sin el nombre del canal\",\n  \"descripcion\": \"una frase\",\n  \"porciones\": 4,\n  \"canal\": \"nombre del canal\",\n  \"dudas\": [\"frases cortas con lo que estimaste o no quedó claro\"],\n  \"partes\": [\n    {\n      \"nombre\": \"nombre de la parte\",\n      \"categoria\": \"principal | acomp | ensalada | salsa | dulce | otro\",\n      \"nutricion\": {\"kcal\": 0, \"proteinas\": 0, \"carbohidratos\": 0, \"grasas\": 0},\n      \"herramientas\": [\"Cuchillo\", \"Tabla\"],\n      \"ingredientes\": [\n        {\"cantidad\": 2, \"unidad\": \"diente\", \"nombre\": \"ajo\", \"tipo\": \"unidad\", \"gramos\": 10, \"g_por_ml\": 0}\n      ],\n      \"preparacion\": [\n        {\"texto\": \"Pelá {0} y picalo bien chiquito.\", \"tecnica\": \"picar\", \"ingredientes\": [0], \"recipiente\": \"Bol chico\", \"video_desde\": 35, \"video_hasta\": 52}\n      ],\n      \"coccion\": [\n        {\"texto\": \"Calentá el aceite de la taza en la sartén y dorá el ajo del bol chico.\", \"detalle\": \"Hasta que tome color, sin quemarse.\", \"tecnica\": \"dorar\", \"minutos\": 2, \"desde\": [\"Taza\", \"Bol chico\"], \"hacia\": \"Sartén\", \"video_desde\": 60, \"video_hasta\": 85}\n      ]\n    }\n  ]\n}\n\nINGREDIENTES\n- \"cantidad\": número, o null si es a gusto.\n- \"unidad\": g, kg, ml, l, cda, cdita, taza, diente, rama, hoja, pizca. Si se cuenta por unidades (2 huevos, 1 cebolla), dejá \"\".\n- \"nombre\": en minúscula y sin la cantidad (\"cebolla\", \"aceite de oliva\").\n- \"tipo\": \"liquido\" (aceite, leche, vino, caldo, crema, miel), \"polvo\" (lo seco que se puede medir con cuchara o taza: harina, azúcar, sal, especias, queso rallado, arroz), \"solido\" (lo que se pesa: carne, manteca, verduras por peso) o \"unidad\" (lo que se cuenta: huevos, dientes de ajo, cebollas).\n- \"gramos\": peso total aproximado de esa cantidad, en gramos. Siempre, también para los líquidos y para lo que se cuenta por unidades.\n- \"g_por_ml\": cuántos gramos pesa un mililitro de ese ingrediente (agua 1, aceite 0.92, miel 1.4, harina 0.55, azúcar 0.85, sal 1.2). Para \"solido\" y \"unidad\" poné 0.\n- \"nutricion\": estimación por porción de esa parte, en kcal y gramos.\n- \"herramientas\": utensilios (cuchillo, tabla, rallador, batidor). Los recipientes no van acá.\n\nPREPARACION: todo lo que se hace con cada ingrediente ANTES de empezar a cocinar o mezclar: sacar de la heladera, lavar, pelar, cortar, picar, rallar, exprimir, pesar, medir.\n- Un paso por ingrediente y por acción.\n- En \"texto\" nombrá cada ingrediente con {n}, donde n es su posición en la lista \"ingredientes\" de esa parte, empezando en 0. La app lo reemplaza por la cantidad y el nombre.\n- \"ingredientes\": los mismos números que usaste en el texto.\n- Decí cómo se corta: forma y tamaño.\n- Para medir líquidos usá la técnica \"verter\". \"pesar\" es solo para sólidos en balanza.\n- \"recipiente\": dónde queda ese ingrediente ya preparado. Usá estos nombres: Bol chico, Bol mediano, Bol grande, Plato, Platito, Taza, Taza medidora, Vasito, Tabla. Elegí el tamaño para las porciones originales de la receta: la app lo agranda sola cuando se cocina para más gente. Los ingredientes que después se agregan juntos en el mismo momento comparten recipiente; los que se agregan en momentos distintos van separados. Usá la menor cantidad de recipientes posible. Si queda en su envase, dejá \"\".\n\nCOCCION: los pasos de cocinar, mezclar y armar, en orden.\n- Una acción principal por paso.\n- En \"texto\" decí de qué recipiente sale cada cosa (\"el ajo del bol chico\") y poné siempre la temperatura del horno o el nivel del fuego.\n- Cuando un ingrediente se agrega directo de su envase (aceite, sal, especias, manteca), nombralo con {n} igual que en la preparación. Si en ese paso se usa solo una parte, escribí la fracción dentro de las llaves, después de dos puntos: {7:0.5} es la mitad del ingrediente 7, {2:0.25} un cuarto del ingrediente 2. Las fracciones de un mismo ingrediente tienen que sumar 1 entre todos los pasos.\n- \"detalle\": la señal de que está listo o un consejo del video. Si no hay, \"\".\n- \"minutos\": solo cuando hay que esperar (hornear, hervir, dorar, reposar, enfriar). Si no, 0.\n- \"desde\": recipientes de los que salen los ingredientes en ese paso. Puede ser [].\n- \"hacia\": dónde queda todo al terminar else if(a==="finsave"){const C=ST.co,nt=document.getElementById("nota");const rec={t:Date.now(),nota:(nt?nt.value:C.nota||"").trim(),foto:C.foto||""};(DB.hist[C.key]=DB.hist[C.key]||[]).push(rec);if(rec.foto)DB.fotos[C.key]=rec.foto;if(C.key[0]==="r"){const id=C.key.slice(2);(DB.hechas[id]=DB.hechas[id]||[]).push(Date.now())}
try{localStorage.setItem("smagsbord1",JSON.stringify(DB))}catch(_){rec.foto="";save();toast("La nota se guardó, pero la foto no entró en este dispositivo.")}
ST.co=null;try{wl&&wl.release();wl=null}catch(_){}toast("Guardado. Buen provecho.")}
else if(a==="cotab"){ST.co.cur=v;ST.co.seen[v]=1}
else if(a==="coprev"){const C=ST.co;C.idx[C.cur]=Math.max(0,(C.idx[C.cur]||0)-1);C.done[C.cur]=0}
else if(a==="conext"){const C=ST.co,p=PARTES[C.cur],i=C.idx[C.cur]||0;if(i<p.pasos.length-1)C.idx[C.cur]=i+1;else{C.done[C.cur]=1;const nx=C.partes.find(x=>!C.done[x]);if(nx){C.cur=nx;C.seen[nx]=1;toast("Parte terminada. Seguimos con la próxima.")}else{C.stage="fin"}}}
else if(a==="topen"){ST.co.topen=ST.co.topen===v?null:v;tget(v)}
else if(a==="tadj"){const[k,d]=v.split("|"),t=tget(k),ms=+d*1000;if(t.run){t.end+=ms;if(t.end<=Date.now()){t.run=false;t.rem=0}}else{t.rem=Math.max(0,t.rem+ms);if(!t.started)t.base=t.rem}t.done=false}
else if(a==="ttog"){const t=tget(v);if(t.done){t.rem=t.base;t.done=false;t.started=false}if(t.run){t.rem=tleft(t);t.run=false}else if(t.rem>0){t.end=Date.now()+t.rem;t.run=true;t.started=true;t.done=false;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(_){}if(!tint)tint=setInterval(tick,250)}}
else if(a==="trst"){const t=tget(v);t.run=false;t.rem=t.base;t.started=false;t.done=false}
else if(a==="tgo"){const[pid,i]=v.split(":"),C=ST.co;C.stage="steps";C.cur=pid;C.seen[pid]=1;C.idx[pid]=+i}
render(keep)});
let lastW=innerWidth>=900;addEventListener("resize",()=>{const w=innerWidth>=900;if(w!==lastW&&ST.co&&ST.co.modo==="simple"){lastW=w;render(true)}lastW=w;syncV()});document.addEventListener("scroll",()=>syncV(),true);
document.addEventListener("input",ev=>{const t=ev.target;if(t.id==="q"){ST.q=t.value;const tmp=document.createElement("div");tmp.innerHTML=home();document.getElementById("res").innerHTML=tmp.querySelector("#res").innerHTML}
else if(t.id==="aq"){ST.armar.q=t.value;const tmp=document.createElement("div");tmp.innerHTML=armar();document.getElementById("alist").innerHTML=tmp.querySelector("#alist").innerHTML}
else if(t.id==="an"){ST.armar.custom=t.value}
else if(t.id==="nota"&&ST.co){ST.co.nota=t.value}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.id==="ifile"){impFiles=[...t.files].slice(0,8);const it=document.getElementById("itxt");if(it)ST.itxt=it.value;ST.ierr="";render(true);return}if((t.id!=="foto"&&t.id!=="rfoto")||!t.files||!t.files[0])return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let d;try{d=c.toDataURL("image/jpeg",.78)}catch(_){d=fr.result}
if(t.id==="foto"&&ST.co){ST.co.foto=d}else if(t.id==="rfoto"&&ST.id){DB.fotos[ST.id]=d;try{localStorage.setItem("smagsbord1",JSON.stringify(DB))}catch(_){toast("La foto se ve ahora, pero no entró en la memoria de este dispositivo.")}}render(true)};im.onerror=()=>toast("No pude leer esa imagen.");im.src=fr.result};fr.readAsDataURL(t.files[0])});
function commit(t){if(t.id==="ren"){const pid=t.dataset.pid,v=t.value.trim();if(v&&v!==PARTES[pid].nombre)DB.nombres[pid]=v;else delete DB.nombres[pid];ST.edit=null;save();render(true)}
else if(t.id==="nl"){const v=t.value.trim();if(v){const e=ent(ST.id);DB.listas.push({id:"l"+Date.now(),nombre:v,items:[e.key]});save()}ST.newlist=false;render(true)}}
document.addEventListener("keydown",ev=>{const t=ev.target;if(ev.key==="Enter"&&(t.id==="ren"||t.id==="nl"))commit(t);else if(ev.key==="Enter"&&t.id==="nl2")document.querySelector('[data-a="addlist"]').click()});
document.addEventListener("focusout",ev=>{const t=ev.target;if((t.id==="ren"||t.id==="nl")&&document.body.contains(t))setTimeout(()=>{if(document.body.contains(t)&&document.activeElement!==t)commit(t)},0)});
applyTheme();render();pendGo();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(DB.pend||[]).length){if(pendT)pendTick();else pendGo()}});
setTimeout(()=>{const s=document.getElementById("splash");s.style.opacity="0";setTimeout(()=>s.remove(),450)},3800);
